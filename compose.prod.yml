# ==============================================================================
# Production Docker Compose — Quiz Live Interactive Platform (TUAF Edition)
# Compliant with TUAF Production Architecture (production.md):
# - Explicit project name: quiz (prevents symlink warning on /home/moodle/apps/quiz)
# - Fixed container_name: quiz-web
# - pull_policy: always (automatically pulls latest GHCR image on `docker compose up -d`)
# - Connects to shared PostgreSQL (`tuaf-supabase-db`) via `tuaf-ai-network`
# - Conflict-free host port 3600 on 10.64.11.109 (Cloudflare Tunnel: http://10.64.11.109:3600)
# - Built-in /health endpoint + container healthcheck
# ==============================================================================

name: quiz

services:
  quiz-web:
    image: ghcr.io/${GHCR_OWNER:-xuanhoatrieu}/quiz:${IMAGE_TAG:-latest}
    pull_policy: always
    # Uncomment `build: .` if building directly on the host instead of pulling GHCR:
    # build: .
    container_name: quiz-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-https://quiz.hoclieu.id.vn}
      WS_PORT: ${WS_PORT:-3001}
      PATH_CONFIG: ${PATH_CONFIG:-/app/config}
      DATABASE_URL: ${DATABASE_URL:-postgresql://quiz_user:QuizTuaf_StrongPassword_2026@tuaf-supabase-db:5432/quiz_db}
      MANAGER_USERNAME: ${MANAGER_USERNAME:-admin}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-TuafQuiz@2026}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-TUAF2026}
      AI_BASE_URL: ${AI_BASE_URL:-http://152.67.112.145:8317/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3-flash-preview}
    # Verified conflict-free port on Production Server 10.64.11.109 (Cloudflare Tunnel: http://10.64.11.109:3600)
    ports:
      - "${QUIZ_PORT:-3600}:3000"
    volumes:
      - quiz-config:/app/config
    networks:
      - tuaf-ai-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  quiz-config:
    name: quiz-config

networks:
  tuaf-ai-network:
    external: true

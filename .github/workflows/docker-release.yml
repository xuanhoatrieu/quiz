name: Docker Release (GHCR)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute GHCR image tags
        id: meta
        run: |
          GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ghcr_repo=${GHCR_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "major_minor=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.ghcr_repo }}:latest
            ghcr.io/${{ steps.meta.outputs.ghcr_repo }}:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.ghcr_repo }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.ghcr_repo }}:${{ steps.meta.outputs.major_minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

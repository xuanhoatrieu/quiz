# ==============================================================================
# Nginx Reverse Proxy — quiz.hoclieu.id.vn
# Supports Cloudflare Tunnel / Cloudflare Edge + Socket.IO WebSocket (/ws)
#
# - If Nginx runs inside `tuaf-nginx` container on `tuaf-ai-network`:
#     use `http://quiz-web:3000`
# - If Nginx runs directly on the Linux host (with `127.0.0.1:3000:3000`):
#     change upstream target to `127.0.0.1:3000`
# ==============================================================================

upstream quiz_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name quiz.hoclieu.id.vn;

    client_max_body_size 101m;

    # Trust Cloudflare real client IP when behind Cloudflare Tunnel / Proxy
    real_ip_header CF-Connecting-IP;

    location = /health {
        access_log off;
        proxy_pass http://quiz_backend/health;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://quiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://quiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
